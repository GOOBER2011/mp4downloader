<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Proxy</title>
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .container {
    background: #1e293b;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    width: 100%;
    max-width: 500px;
    text-align: center;
  }
  h1 { margin-top: 0; color: #38bdf8; }
  p { color: #94a3b8; margin-bottom: 20px; }
  
  input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    padding: 16px;
    background: #0b1220;
    border: 2px solid #475569;
    border-radius: 8px;
    color: #e2e8f0;
    font-size: 1.1em;
    margin-bottom: 16px;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: #38bdf8;
  }
  
  button {
    width: 100%;
    padding: 16px;
    background: #38bdf8;
    color: #0f172a;
    border: none;
    border-radius: 8px;
    font-size: 1.2em;
    font-weight: 900;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #7dd3fc; }
</style>
</head>
<body>

<div class="container">
  <h1>🔗 Go Through Proxy</h1>
  <p>Paste your link below and click Go.</p>
  
  <form id="proxyForm">
    <!-- PASTE YOUR DESTINATION LINK HERE -->
    <input type="text" id="targetUrl" placeholder="Paste link here (e.g. https://google.com)" required autocomplete="off">
    
    <button type="submit">GO</button>
  </form>
</div>

<script>
  // ================================================================
  // 👇 STEP 1: PASTE YOUR VERCEL URL RIGHT HERE (keep the quotes!) 👇
  // ================================================================
  const VERCEL_PROXY_URL = "YOUR_VERCEL_URL_HERE"; 
  // Example: const VERCEL_PROXY_URL = "https://mp4downloader-uvc4.vercel.app";
  // ================================================================

  document.getElementById('proxyForm').addEventListener('submit', function(e) {
    e.preventDefault(); // Stop normal form submission
    
    let target = document.getElementById('targetUrl').value.trim();
    
    // Check if the user forgot to type "https://"
    if (!target.startsWith('http://') && !target.startsWith('https://')) {
      target = 'https://' + target;
    }

    // Encode the target URL so it's safe to put inside the proxy URL
    const encodedTarget = encodeURIComponent(target);
    
    // Build the final URL
    // Format: https://your-vercel-url/api/proxy?url=https%3A%2F%2Fexample.com
    const finalUrl = VERCEL_PROXY_URL + "/api/proxy?url=" + encodedTarget;

    // Open it in a new tab
    window.open(finalUrl, '_blank');
    
    // Clear the input box for next time
    document.getElementById('targetUrl').value = '';
  });
</script>

</body>
</html>
